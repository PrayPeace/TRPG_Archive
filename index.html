<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRPG 세션 기록</title>
<style>
  *{box-sizing:border-box}
  :root{--bg:#14161a;--panel:#1b1d22;--line:#2c3038;--txt:#e8e8e8;--dim:#9aa0a8;--blue:#3b6df0;--red:#d9483b;--green:#1f7a3a}
  body{font-family:system-ui,"Malgun Gothic",sans-serif;margin:0;background:var(--bg);color:var(--txt)}
  .wrap{max-width:980px;margin:0 auto;padding:14px}
  h1{font-size:18px;margin:0}
  input,textarea,select{width:100%;background:#22252b;border:1px solid #3a3e46;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;font-family:inherit}
  textarea{resize:vertical}
  label{display:block;font-size:13px;color:#b8bec7;margin:10px 0 4px}
  button{padding:9px 16px;border:0;border-radius:6px;font-size:14px;cursor:pointer;background:var(--blue);color:#fff;white-space:nowrap}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:#2c3038}
  button.stop{background:var(--red)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .bar{position:sticky;top:0;z-index:5;background:#101215;border-bottom:1px solid var(--line)}
  .bar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px}
  .pill{font-size:12px;padding:4px 9px;border-radius:999px;background:#2c3038;color:#cfd3d9}
  .pill.on{background:var(--green)} .pill.err{background:#8a2a22}
  .meter{width:90px;height:8px;background:#2c3038;border-radius:4px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:#3ecf6b}
  #interim{color:var(--dim);font-style:italic;font-size:13px;min-height:18px;padding:4px 14px;max-width:980px;margin:0 auto}
  .tabs{display:flex;gap:4px;overflow-x:auto;margin:10px 0}
  .tabs button{background:#22252b;color:#cfd3d9}
  .tabs button.act{background:var(--blue);color:#fff}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
  .scroll{max-height:68vh;overflow-y:auto}
  .line{padding:2px 0;line-height:1.6;font-size:15px}
  .line .t{color:#7c838d;font-size:12px;margin-right:6px}
  .line .n{font-weight:600;margin-right:6px}
  .sum{border-bottom:1px solid var(--line);padding:10px 0;white-space:pre-wrap;line-height:1.6}
  .sum .h{color:var(--dim);font-size:12px;margin-bottom:4px}
  .sess{color:#7fb0ff;font-weight:700;margin:14px 0 4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .card{background:#22252b;border-radius:8px;padding:10px;font-size:14px;line-height:1.55}
  .card b{font-size:15px}
  .card .k{color:var(--dim);font-size:12px}
  h3{font-size:15px;margin:16px 0 8px;color:#cfd3d9}
  .hide{display:none}
  .note{font-size:12px;color:var(--dim)}
  .warn{background:#5a3b12;padding:10px;border-radius:6px;font-size:13px;margin:8px 0}
  img.handout{max-width:100%;border-radius:6px;margin:6px 0}
  .tag{font-size:11px;padding:1px 6px;border-radius:4px;background:#3a3e46;margin-left:6px}
  .tag.ok{background:#1f5a33}
</style>
</head>
<body>

<!-- 처음 들어올 때 -->
<div id="join" class="wrap hide">
  <h1>TRPG 세션 기록 · 입장</h1>
  <p class="note">키퍼가 보내 준 링크로 들어오면 대부분 채워져 있어요. 이름만 넣으면 됩니다.</p>
  <label>내 이름 (회의록에 붙는 이름)</label>
  <input id="jName" placeholder="예: 평유">
  <label>방 주소 (스크립트 주소 또는 ID)</label>
  <input id="jUrl" placeholder="https://script.google.com/macros/s/…/exec">
  <label>방 비밀번호</label>
  <input id="jPw" type="password">
  <div class="row" style="margin-top:12px"><button id="jGo">입장</button><span id="jMsg" class="note"></span></div>
</div>

<!-- 본 화면 -->
<div id="app" class="hide">
  <div class="bar"><div class="wrap">
    <h1>TRPG 세션 기록</h1>
    <span class="pill" id="sessPill">세션 -</span>
    <span class="pill" id="netPill">연결 중</span>
    <span style="flex:1"></span>
    <span class="note" id="meName"></span>
    <div class="meter"><i id="level"></i></div>
    <span class="pill" id="micPill">마이크 꺼짐</span>
    <button id="micBtn">받아쓰기 시작</button>
  </div></div>
  <div id="interim"></div>

  <div class="wrap">
    <div class="tabs" id="tabs">
      <button data-t="log" class="act">회의록</button>
      <button data-t="sum">요약</button>
      <button data-t="notes">장소·NPC·단서</button>
      <button data-t="chars">캐릭터</button>
      <button data-t="imgs">이미지</button>
      <button data-t="set">설정</button>
    </div>

    <section id="t-log" class="panel">
      <div class="row" style="margin-bottom:8px">
        <label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="onlyMine" style="width:auto"> 내 말만</label>
        <span style="flex:1"></span>
        <button class="ghost" id="copyLog">회의록 복사</button>
      </div>
      <div id="log" class="scroll"></div>
    </section>

    <section id="t-sum" class="panel hide">
      <div class="row" style="margin-bottom:6px">
        <span class="note" id="sumInfo">5분마다 자동으로 정리됩니다.</span>
        <span style="flex:1"></span>
        <button class="ghost" id="copySum">요약 전체 복사 (한글에 붙여넣기용)</button>
      </div>
      <details><summary class="note">지금까지의 누적 줄거리</summary><div id="story" style="white-space:pre-wrap;line-height:1.6;margin-top:6px"></div></details>
      <div id="sums" class="scroll"></div>
    </section>

    <section id="t-notes" class="panel hide">
      <h3>장소</h3><div id="nPlaces" class="grid"></div>
      <h3>NPC</h3><div id="nNpcs" class="grid"></div>
      <h3>단서·정보</h3><div id="nClues"></div>
      <h3>핸드아웃</h3><div id="nHand" class="grid"></div>
    </section>

    <section id="t-chars" class="panel hide"><div id="chars" class="grid"></div></section>

    <section id="t-imgs" class="panel hide">
      <div id="imgUp" class="hide" style="margin-bottom:12px">
        <label>핸드아웃·이미지 올리기 (키퍼)</label>
        <input type="file" id="imgFile" accept="image/*">
        <label>메모 (선택)</label>
        <input id="imgCap" placeholder="예: 저택 2층 서재에서 발견한 편지">
        <div class="row" style="margin-top:8px"><button id="imgGo">올리고 분석</button><span id="imgMsg" class="note"></span></div>
      </div>
      <div id="imgs"></div>
    </section>

    <section id="t-set" class="panel hide">
      <label>내 이름</label>
      <div class="row"><input id="sName" style="flex:1"><button class="ghost" id="sNameSave">바꾸기</button></div>
      <label>마이크 확인</label>
      <div class="row"><button class="ghost" id="micTest">마이크 권한 요청·소리 확인</button><span id="micMsg" class="note"></span></div>
      <div class="row" style="margin-top:14px">
        <button class="ghost" id="leave">방 나가기 (설정 지우기)</button>
      </div>

      <h3>키퍼 메뉴</h3>
      <div id="kLock">
        <div class="row"><input id="kPw" type="password" placeholder="키퍼 비밀번호" style="flex:1"><button id="kGo">키퍼로 전환</button></div>
        <span id="kMsg" class="note"></span>
      </div>
      <div id="kMenu" class="hide">
        <div class="row">
          <button id="kProcess">지금 바로 정리</button>
          <button class="ghost" id="kSession">새 세션 시작 (다음 날 이어서 할 때)</button>
          <span id="kOut" class="note"></span>
        </div>

        <label>용어집 (쉼표로 구분 · 받아쓰기와 AI 보정에 함께 쓰임)</label>
        <textarea id="kGloss" rows="3"></textarea>
        <div class="row" style="margin-top:6px"><button class="ghost" id="kGlossSave">용어집 저장</button></div>

        <label>캐릭터시트 (구글 스프레드시트 주소)</label>
        <div class="row"><input id="kCharUrl" style="flex:1" placeholder="https://docs.google.com/spreadsheets/d/…"><button class="ghost" id="kTabs">탭 불러오기</button></div>
        <div id="kMap" style="margin-top:8px"></div>
        <div class="row" style="margin-top:8px">
          <button class="ghost" id="kCharSave">캐릭터 연결 저장</button>
          <button class="ghost" id="kCharRef">캐릭터 다시 읽기</button>
          <span id="kCharMsg" class="note"></span>
        </div>

        <label>플레이어에게 보낼 링크</label>
        <div class="row"><input id="kLink" readonly style="flex:1"><button class="ghost" id="kCopyLink">복사</button></div>
        <div class="note">링크에는 방 비밀번호가 들어 있어요. 단톡방 등 친구들끼리만 공유하세요.</div>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const S = {
  get(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(_){} },
  del(k){ try{ localStorage.removeItem(k); }catch(_){} }
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

/* ── 설정 읽기: 링크 #s=스크립트ID&p=방비번 ── */
const hp = new URLSearchParams(location.hash.slice(1));
if (hp.get('s')) S.set('t_url', hp.get('s'));
if (hp.get('p')) S.set('t_pw', hp.get('p'));
if (hp.get('s') || hp.get('p')) history.replaceState(null, '', location.pathname + location.search);

function scriptUrl(v){
  v = (v || '').trim();
  if (!v) return '';
  if (v.startsWith('http')) return v.replace(/\/(dev|exec)?\/?$/, '/exec').replace(/\/exec\/exec$/, '/exec');
  return 'https://script.google.com/macros/s/' + v + '/exec';
}
const cfg = { url: scriptUrl(S.get('t_url')), pw: S.get('t_pw') || '', name: S.get('t_name') || '', kpw: S.get('t_kpw') || '' };

/* ── 서버 통신 ── */
async function api(action, params){
  const q = new URLSearchParams(Object.assign({ action, pw: params && params.pw || cfg.pw }, params || {}));
  const r = await fetch(cfg.url + '?' + q.toString());
  return r.json();
}
async function post(body){
  body.pw = body.pw || cfg.pw;
  const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify(body) });
  return r.json();
}

/* ── 입장 ── */
function showJoin(msg){
  $('join').classList.remove('hide'); $('app').classList.add('hide');
  $('jName').value = cfg.name; $('jUrl').value = S.get('t_url') || ''; $('jPw').value = cfg.pw;
  if (msg) $('jMsg').textContent = msg;
}
$('jGo').onclick = async () => {
  const name = $('jName').value.trim(), url = scriptUrl($('jUrl').value), pw = $('jPw').value.trim();
  if (!name || !url || !pw) { $('jMsg').textContent = '세 칸을 모두 채워 주세요'; return; }
  $('jMsg').textContent = '확인 중…';
  cfg.url = url; cfg.pw = pw;
  try {
    const r = await api('ping');
    if (!r.ok) { $('jMsg').textContent = r.error || '입장 실패'; return; }
    cfg.name = name; S.set('t_name', name); S.set('t_url', $('jUrl').value.trim()); S.set('t_pw', pw);
    start();
  } catch (e) { $('jMsg').textContent = '방 주소에 연결하지 못했어요. 주소를 확인해 주세요.'; }
};

/* ── 탭 ── */
$('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('tabs').children].forEach(x => x.classList.toggle('act', x === b));
  ['log','sum','notes','chars','imgs','set'].forEach(t => $('t-' + t).classList.toggle('hide', t !== b.dataset.t));
};

/* ── 회의록 ── */
let lastId = 0, allLines = [];
const colors = ['#7fb0ff','#ffb86b','#8be28b','#f78fb3','#c3a6ff','#6fe0d6','#f5d76e'];
const colorOf = name => { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return colors[h % colors.length]; };
function addLogLines(lines){
  if (!lines.length) return;
  const box = $('log'), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const mineOnly = $('onlyMine').checked;
  lines.forEach(l => {
    allLines.push(l);
    const d = el('div', 'line'); d.dataset.name = l.name;
    if (mineOnly && l.name !== cfg.name) d.classList.add('hide');
    d.append(el('span', 't', String(l.time).slice(11, 19)));
    const n = el('span', 'n', l.name + ':'); n.style.color = colorOf(l.name); d.append(n);
    d.append(el('span', '', l.text));
    box.append(d);
  });
  if (atBottom) box.scrollTop = box.scrollHeight;
}
$('onlyMine').onchange = () => {
  const m = $('onlyMine').checked;
  [...$('log').children].forEach(d => d.classList.toggle('hide', m && d.dataset.name !== cfg.name));
};
async function copyText(btn, text, label){
  try { await navigator.clipboard.writeText(text); btn.textContent = '복사됨'; } catch(_) { btn.textContent = '복사 실패'; }
  setTimeout(() => btn.textContent = label, 1500);
}
$('copyLog').onclick = () => copyText($('copyLog'), allLines.map(l => `[${String(l.time).slice(11,19)}] ${l.name}: ${l.text}`).join('\n'), '회의록 복사');

/* ── 자료 표시 ── */
let data = null, ver = {};
function renderAll(d){
  data = d;
  $('sessPill').textContent = '세션 ' + d.v.session;
  // 요약
  $('story').textContent = d.story || '(아직 없음)';
  const box = $('sums'); box.innerHTML = '';
  let cur = null;
  d.summaries.forEach(s => {
    if (s.session !== cur) { cur = s.session; box.append(el('div', 'sess', '세션 ' + cur)); }
    const w = el('div', 'sum'); w.append(el('div', 'h', String(s.from).slice(11,16) + ' ~ ' + String(s.to).slice(11,16)));
    w.append(el('div', '', s.text)); box.append(w);
  });
  if (!d.summaries.length) box.append(el('div', 'note', '아직 정리된 요약이 없어요. 대화가 쌓이면 5분 안에 생깁니다.'));
  // 정리
  const n = d.notes || {};
  const fill = (id, arr, make) => { const b = $(id); b.innerHTML = ''; (arr || []).forEach(x => b.append(make(x))); if (!(arr||[]).length) b.append(el('div','note','아직 없음')); };
  fill('nPlaces', n.places, p => { const c = el('div','card'); c.append(el('b','',p.name||'')); if (p.desc) c.append(el('div','',p.desc)); if (p.found) { c.append(el('div','k','발견')); c.append(el('div','',p.found)); } return c; });
  fill('nNpcs', n.npcs, p => { const c = el('div','card'); c.append(el('b','',p.name||'')); [['특징',p.traits],['했던 말',p.said],['관계',p.relation]].forEach(([k,v]) => { if (v) { c.append(el('div','k',k)); c.append(el('div','',v)); } }); return c; });
  fill('nClues', n.clues, p => { const c = el('div','card'); c.style.marginBottom = '6px'; c.append(el('span','',p.text||'')); c.append(el('span','tag' + (p.status === '해결' ? ' ok' : ''), p.status || '미해결')); return c; });
  fill('nHand', n.handouts, p => { const c = el('div','card'); c.append(el('b','',p.title||'')); const t = el('div','',p.text||''); t.style.whiteSpace = 'pre-wrap'; c.append(t); return c; });
  // 캐릭터
  const cb = $('chars'); cb.innerHTML = '';
  (d.characters || []).forEach(ch => {
    const c = el('div','card');
    c.append(el('b','', (ch.name || ch.tab) + '  '));
    c.append(el('span','k', '(' + (ch.player || '?') + ')'));
    if (ch.occupation || ch.age) c.append(el('div','', [ch.occupation, ch.age].filter(Boolean).join(' · ')));
    const st = [['HP',ch.hp],['이성',ch.san],['MP',ch.mp],['행운',ch.luck]].filter(x => x[1]).map(x => x[0] + ' ' + x[1]).join('  ');
    if (st) { const s = el('div','',st); s.style.fontWeight = '600'; c.append(s); }
    if (ch.skills && ch.skills.length) { c.append(el('div','k','주요 기술')); c.append(el('div','', ch.skills.map(s => s.name + ' ' + s.value).join(', '))); }
    if (ch.items) { c.append(el('div','k','소지품')); c.append(el('div','',ch.items)); }
    if (ch.memo) { c.append(el('div','k','메모')); c.append(el('div','',ch.memo)); }
    cb.append(c);
  });
  if (!(d.characters || []).length) cb.append(el('div','note','키퍼가 설정에서 캐릭터시트를 연결하면 여기에 나와요.'));
  // 이미지
  const ib = $('imgs'); ib.innerHTML = '';
  (d.images || []).slice().reverse().forEach(im => {
    const c = el('div','card'); c.style.marginBottom = '10px';
    c.append(el('b','', im.title || '이미지'));
    c.append(el('span','k','  ' + String(im.time).slice(5,16) + ' · 세션 ' + im.session));
    const img = el('img','handout'); img.src = im.url; img.loading = 'lazy'; img.alt = im.title || ''; c.append(img);
    if (im.text) { c.append(el('div','k','글자')); const t = el('div','',im.text); t.style.whiteSpace = 'pre-wrap'; c.append(t); }
    if (im.description) { c.append(el('div','k','설명')); c.append(el('div','',im.description)); }
    ib.append(c);
  });
  if (!(d.images || []).length) ib.append(el('div','note','아직 올라온 이미지가 없어요.'));
  // 키퍼 설정값
  if (document.activeElement !== $('kGloss')) $('kGloss').value = d.glossary || '';
  if (!$('kCharUrl').value) $('kCharUrl').value = d.charUrl || '';
  if (!$('kMap').children.length && (d.charMap || []).length) drawMap(d.charMap.map(m => m.tab), d.charMap);
}
$('copySum').onclick = () => {
  if (!data) return;
  let cur = null, outText = [];
  data.summaries.forEach(s => {
    if (s.session !== cur) { cur = s.session; outText.push('\n■ 세션 ' + cur); }
    outText.push('(' + String(s.from).slice(11,16) + '~' + String(s.to).slice(11,16) + ')\n' + s.text);
  });
  copyText($('copySum'), outText.join('\n').trim(), '요약 전체 복사 (한글에 붙여넣기용)');
};

/* ── 주기적으로 읽어 오기 ── */
let pollTimer = 0, failCount = 0;
async function pollOnce(){
  try {
    const r = await api('poll', { since: lastId });
    if (!r.ok) throw new Error(r.error);
    failCount = 0;
    $('netPill').textContent = '연결됨'; $('netPill').className = 'pill on';
    addLogLines(r.lines); if (r.lines.length) lastId = r.lines[r.lines.length - 1].id;
    const v = r.v;
    if (!data || ['sumVer','notesVer','charVer','imgVer','session'].some(k => v[k] !== ver[k])) {
      const d = await api('data'); if (d.ok) { ver = d.v; renderAll(d); }
    }
  } catch (e) {
    failCount++;
    $('netPill').textContent = '연결 끊김 · 재시도'; $('netPill').className = 'pill err';
    if (String(e.message || '').includes('비밀번호')) { stopAll(); showJoin('방 비밀번호가 틀렸어요'); return; }
  }
  pollTimer = setTimeout(pollOnce, failCount ? 8000 : 5000);
}

/* ── 받아쓰기 → 시트로 보내기 ── */
let queue = [];
try { queue = JSON.parse(S.get('t_queue') || '[]'); } catch(_) { queue = []; }
function saveQueue(){ S.set('t_queue', JSON.stringify(queue.slice(-500))); }
async function flush(){
  if (!queue.length) return;
  const batch = queue.slice(0, 50);
  try {
    const r = await post({ action: 'lines', name: cfg.name, items: batch });
    if (r.ok) { queue = queue.slice(batch.length); saveQueue(); }
  } catch (_) { /* 다음에 다시 */ }
}
setInterval(flush, 4000);

let ws = null, rec = null, stream = null, running = false, wantStop = false, keyterms = [];
let meterCtx = null, meterRaf = 0;
function meter(s){
  stopMeter();
  try {
    meterCtx = new (window.AudioContext || window.webkitAudioContext)();
    const an = meterCtx.createAnalyser(); an.fftSize = 512;
    meterCtx.createMediaStreamSource(s).connect(an);
    const buf = new Uint8Array(an.fftSize);
    const tick = () => { an.getByteTimeDomainData(buf); let p = 0; for (const v of buf) p = Math.max(p, Math.abs(v - 128));
      $('level').style.width = Math.min(100, p / 128 * 220) + '%'; meterRaf = requestAnimationFrame(tick); };
    tick();
  } catch(_) {}
}
function stopMeter(){ cancelAnimationFrame(meterRaf); $('level').style.width = '0'; if (meterCtx) { try { meterCtx.close(); } catch(_){} meterCtx = null; } }
function micState(cls, text){ $('micPill').className = 'pill ' + cls; $('micPill').textContent = text; }

function micError(e){
  if (/system/i.test(e.message || '')) return '윈도우가 마이크를 막고 있어요 (설정 → 개인 정보 → 마이크)';
  return ({ NotAllowedError: '마이크 권한이 막혔어요 (주소창 왼쪽 아이콘 → 마이크 허용)', NotFoundError: '마이크를 찾지 못했어요',
    NotReadableError: '다른 프로그램이 마이크를 쓰는 중이에요' })[e.name] || ('마이크 오류: ' + e.name);
}

async function startMic(){
  if (!stream) {
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
    catch (e) { micState('err', micError(e)); return; }
    meter(stream);
  }
  wantStop = false; micState('', '연결 중…');
  let tk;
  try { tk = await api('token'); } catch (_) { tk = { ok: false, error: '방 주소 연결 실패' }; }
  if (!tk.ok) { micState('err', tk.error || '토큰 실패'); setTimeout(() => { if (!wantStop) startMic(); }, 5000); return; }
  keyterms = tk.keyterms || [];
  const p = new URLSearchParams({ model: 'nova-3', language: 'ko', smart_format: 'true', interim_results: 'true', endpointing: '400' });
  keyterms.forEach(k => p.append('keyterm', k));
  ws = new WebSocket('wss://api.deepgram.com/v1/listen?' + p.toString(), ['bearer', tk.token]);
  ws.onopen = () => {
    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
    rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    rec.ondataavailable = ev => { if (ev.data.size && ws && ws.readyState === 1) ws.send(ev.data); };
    rec.start(250);
    running = true; micState('on', '듣는 중'); $('micBtn').textContent = '받아쓰기 멈추기'; $('micBtn').classList.add('stop');
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch(_) { return; }
    if (m.type !== 'Results') return;
    const t = (m.channel && m.channel.alternatives && m.channel.alternatives[0] || {}).transcript || '';
    if (m.is_final) { $('interim').textContent = ''; if (t.trim()) { queue.push({ t: new Date().toISOString(), text: t.trim() }); saveQueue(); } }
    else $('interim').textContent = cfg.name + ': ' + t;
  };
  ws.onclose = () => {
    if (rec && rec.state !== 'inactive') { try { rec.stop(); } catch(_){} }
    rec = null; running = false;
    if (wantStop) return;
    micState('err', '끊김 · 다시 연결 중');
    setTimeout(() => { if (!wantStop) startMic(); }, 1500);
  };
}
function stopAll(){
  wantStop = true;
  if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify({ type: 'CloseStream' })); } catch(_){} }
  setTimeout(() => { if (ws) { try { ws.close(); } catch(_){} } }, 800);
  if (rec && rec.state !== 'inactive') { try { rec.stop(); } catch(_){} }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  stopMeter(); running = false; $('interim').textContent = '';
  micState('', '마이크 꺼짐'); $('micBtn').textContent = '받아쓰기 시작'; $('micBtn').classList.remove('stop');
  flush();
}
$('micBtn').onclick = () => (running || (ws && ws.readyState <= 1 && !wantStop)) ? stopAll() : startMic();
window.addEventListener('beforeunload', () => { saveQueue(); });

$('micTest').onclick = async () => {
  $('micMsg').textContent = '브라우저 위쪽 창에서 "허용"을 눌러 주세요…';
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    $('micMsg').textContent = '연결됨: ' + (s.getAudioTracks()[0] || {}).label + ' · 말하면 위쪽 초록 막대가 움직여요';
    if (!stream) { meter(s); setTimeout(() => { if (!stream) { s.getTracks().forEach(t => t.stop()); stopMeter(); } }, 8000); }
  } catch (e) { $('micMsg').textContent = micError(e) + ' / ' + e.name; }
};

/* ── 설정 ── */
$('sNameSave').onclick = () => { const n = $('sName').value.trim(); if (!n) return; cfg.name = n; S.set('t_name', n); $('meName').textContent = n; };
$('leave').onclick = () => { stopAll(); ['t_url','t_pw','t_name','t_kpw'].forEach(S.del); location.reload(); };

async function keeperOn(pw){
  const r = await api('ping', { pw });
  if (!r.ok || !r.keeper) return false;
  cfg.kpw = pw; S.set('t_kpw', pw);
  $('kLock').classList.add('hide'); $('kMenu').classList.remove('hide'); $('imgUp').classList.remove('hide');
  const id = (S.get('t_url') || '').match(/\/s\/([^/]+)/);
  $('kLink').value = location.origin + location.pathname + '#s=' + encodeURIComponent(id ? id[1] : (S.get('t_url') || '')) + '&p=' + encodeURIComponent(cfg.pw);
  return true;
}
$('kGo').onclick = async () => { $('kMsg').textContent = '확인 중…'; $('kMsg').textContent = (await keeperOn($('kPw').value.trim())) ? '' : '키퍼 비밀번호가 틀렸어요'; };
$('kCopyLink').onclick = () => copyText($('kCopyLink'), $('kLink').value, '복사');
const kpost = b => post(Object.assign(b, { pw: cfg.kpw }));
$('kProcess').onclick = async () => { $('kOut').textContent = '정리 중… (10~40초)'; const r = await kpost({ action: 'process' }); $('kOut').textContent = r.ok ? (r.message || '완료') : r.error; };
$('kSession').onclick = async () => {
  if ($('kSession').dataset.arm !== '1') { $('kSession').dataset.arm = '1'; $('kSession').textContent = '한 번 더 누르면 새 세션 시작'; setTimeout(() => { $('kSession').dataset.arm = ''; $('kSession').textContent = '새 세션 시작 (다음 날 이어서 할 때)'; }, 4000); return; }
  $('kSession').dataset.arm = ''; $('kOut').textContent = '이전 대화 정리 후 새 세션을 엽니다…';
  const r = await kpost({ action: 'newSession' }); $('kOut').textContent = r.ok ? ('세션 ' + r.session + ' 시작') : r.error;
  $('kSession').textContent = '새 세션 시작 (다음 날 이어서 할 때)';
};
$('kGlossSave').onclick = async () => { const r = await kpost({ action: 'glossary', glossary: $('kGloss').value }); $('kOut').textContent = r.ok ? '용어집 저장됨 (다음 연결부터 받아쓰기에 반영)' : r.error; };

function drawMap(tabs, saved){
  const box = $('kMap'); box.innerHTML = '';
  tabs.forEach(t => {
    const s = (saved || []).find(m => m.tab === t);
    const row = el('div', 'row'); row.style.margin = '4px 0';
    const cb = el('input'); cb.type = 'checkbox'; cb.style.width = 'auto'; cb.checked = !!s; cb.dataset.tab = t;
    const nm = el('span', '', t); nm.style.minWidth = '120px';
    const pl = el('input'); pl.placeholder = '플레이어 이름 (회의록 이름과 같게)'; pl.value = s ? s.player : ''; pl.style.flex = '1';
    row.append(cb, nm, pl); box.append(row);
  });
  if (!tabs.length) box.append(el('div', 'note', '탭이 없어요'));
}
$('kTabs').onclick = async () => {
  $('kCharMsg').textContent = '탭 읽는 중…';
  const r = await api('tabs', { pw: cfg.kpw, url: $('kCharUrl').value.trim() });
  if (!r.ok) { $('kCharMsg').textContent = r.error + ' (시트를 키퍼 구글 계정이 열 수 있어야 해요)'; return; }
  drawMap(r.tabs, data && data.charMap); $('kCharMsg').textContent = '캐릭터 탭에 체크하고 플레이어 이름을 적어 주세요';
};
$('kCharSave').onclick = async () => {
  const map = [...$('kMap').querySelectorAll('.row')].map(r => { const i = r.querySelectorAll('input'); return i[0].checked ? { tab: i[0].dataset.tab, player: i[1].value.trim() } : null; }).filter(Boolean);
  $('kCharMsg').textContent = 'AI가 캐릭터시트를 읽는 중… (인원수 × 10초 정도)';
  const r = await kpost({ action: 'chars', url: $('kCharUrl').value.trim(), map });
  $('kCharMsg').textContent = r.ok ? r.message : r.error;
};
$('kCharRef').onclick = async () => { $('kCharMsg').textContent = '다시 읽는 중…'; const r = await kpost({ action: 'charsRefresh' }); $('kCharMsg').textContent = r.ok ? r.message : r.error; };

/* ── 이미지 ── */
function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const max = 1568, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
$('imgGo').onclick = async () => {
  const f = $('imgFile').files[0]; if (!f) { $('imgMsg').textContent = '이미지를 골라 주세요'; return; }
  $('imgGo').disabled = true; $('imgMsg').textContent = '올리고 AI가 읽는 중… (20~40초)';
  try {
    const data64 = await shrink(f);
    const r = await kpost({ action: 'image', data: data64, mime: 'image/jpeg', caption: $('imgCap').value.trim() });
    $('imgMsg').textContent = r.ok ? ('완료: ' + (r.title || '')) : r.error;
    if (r.ok) { $('imgFile').value = ''; $('imgCap').value = ''; }
  } catch (e) { $('imgMsg').textContent = '실패: ' + e.message; }
  $('imgGo').disabled = false;
};

/* ── 시작 ── */
function start(){
  $('join').classList.add('hide'); $('app').classList.remove('hide');
  $('meName').textContent = cfg.name; $('sName').value = cfg.name;
  if (!navigator.mediaDevices || !window.MediaRecorder) { micState('err', '이 브라우저는 받아쓰기를 못 해요 (PC 크롬 권장)'); $('micBtn').disabled = true; }
  pollOnce();
  if (cfg.kpw) keeperOn(cfg.kpw);
}
if (cfg.url && cfg.pw && cfg.name) start(); else showJoin();
})();
</script>
